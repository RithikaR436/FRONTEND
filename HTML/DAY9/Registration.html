
<html>
<head>
  <title>Registration Form</title>
</head>
<body><center>
     <h1>Registration Form</h1> 
     <p><label >Full Name:</label>
     <input type="text" placeholder="Enter Your Full Name" required></p>  
     <p><label >Email:</label>
    <input type="email" placeholder="Enter Email" required></p>
    <p><label >Mobile Number:</label>
    <input type="tel" placeholder="1234567890" minlength="10" maxlength="10" required></p>
     <p><label >User Name:</label>
    <input type="text" placeholder="Enter Username" minlength="6" maxlength="16"></p> 
    <p><label >Password:</label>
    <input type="text" placeholder="Enter your password" required></p>
    <p><label > Confirm Password:</label>
    <input type="text" placeholder="Confirm Password" required></p>
    <p><label>Gender:</label><br>
    <input type="radio"  value="male"> Male
    <input type="radio"  value="female"> Female
    <input type="radio"  value="other"> Other </p>
    <label>Date of Birth:</label><br>
    <input type="date"  required>
    <p><input type="button"value="submit"></p>

    
    
    
    
</center>
</body>
</html>
