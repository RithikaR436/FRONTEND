<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Bootstrap Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MyBrand</a>
    <div class="d-flex gap-3">
      <a class="nav-link text-white" href="#">Home</a>
      <a class="nav-link text-white" href="#">About</a>
      <a class="nav-link text-white" href="#">Contact</a>
    </div>
  </div>
</nav>

<div id="carousel1" class="carousel slide my-3" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="assets/images/banner.png" class="d-block w-100" alt="one">
    </div>
    <div class="carousel-item">
      <img src="assets/images/logo.png" class="d-block w-100" alt="two">
    </div>
  </div>
  <button class="carousel-control-prev" data-bs-target="#carousel1" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" data-bs-target="#carousel1" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

<div class="d-flex flex-wrap gap-3 container">
  <div class="card" style="width: 250px;">
    <img src="https://picsum.photos/id/1021/250/150" class="card-img-top">
    <div class="card-body">
      <h5 class="card-title">Card One</h5>
    </div>
  </div>
  <div class="card" style="width: 250px;">
    <img src="https://picsum.photos/id/1024/250/150" class="card-img-top">
    <div class="card-body">
      <h5 class="card-title">Card Two</h5>
    </div>
  </div>
</div>

<form class="container my-4">
  <input type="text" class="form-control mb-2" placeholder="Name">
  <input type="email" class="form-control mb-2" placeholder="Email">
  <button class="btn btn-dark">Submit</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
