<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <h1>POSITIVE, NEGATIVE, OR ZERO</h1>

    <script>
        let number = -10;

        if(number>0){
            console.log("Positive")
        }
        else if(number<0){
             console.log("Negative")
             }
        else if (number===0){
                console.log("Zero")
            }
        else{
            console.log("Invalid")
            
        }
    </script>
</body>
</html>
