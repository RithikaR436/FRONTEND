<!DOCTYPE html>
<html lang="en">

<body>
    <h1>PRODUCT PRICE CALCULATOR</h1>
    <script>
        const product = {
  name: "Laptop",
  price: 60000,
  quantity: 2
};

const printProductTotal = ({ name, price, quantity }) => {
  const total = price * quantity;

  console.log(`${name}
Price: ${price}
Quantity: ${quantity}
Total: ${total}`);
};

printProductTotal(product);
    </script>
</body>
