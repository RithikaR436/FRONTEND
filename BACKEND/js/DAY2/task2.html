<body>
    <h1>SIMPLE CALCULATOR</h1>
    <script>
        const add = (a, b) => a + b;
      const subtract = (a, b) => a - b;
const multiply = (a, b) => a * b;
const divide = (a, b) => a / b;

console.log(add(20, 10));       
console.log(subtract(50, 15));  
console.log(multiply(6, 7));    
console.log(divide(100, 4));   
    </script>
</body>
