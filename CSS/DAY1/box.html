<!DOCTYPE html>
<html>
<head>
<title>Five Colored Boxes</title>

</head>
<body>
    <style>
    .box3 {
        background-color: lightpink;
        color: darkred;
        width: 300px;
        height: 150px;
        text-align: center;
    }

    .box4 {
        background-color: lightgreen;
        color: darkgreen;
        width: 300px;
        height: 150px;
        text-align: center;
    }

    .box5 {
        background-color: lightgray;
        color: black;
        width: 300px;
        height: 150px;
        text-align: center;
    }
</style>

<div style="background-color: lightblue; color: darkblue; width: 300px; height: 150px; text-align: center;">
    <h2>Box 1</h2>
    <p>This is the first box using inline CSS.</p>
</div>

<div style="background-color: lightyellow; color: darkorange; width: 300px; height: 150px; text-align: center;">
    <h2>Box 2</h2>
    <p>This is the second box using inline CSS.</p>
</div>

<div class="box3">
    <h2>Box 3</h2>
    <p>This is the third box using internal CSS.</p>
</div>

<div class="box4">
    <h2>Box 4</h2>
    <p>This is the fourth box using internal CSS.</p>
</div>

<div class="box5">
    <h2>Box 5</h2>
    <p>This is the fifth box using internal CSS.</p>
</div>

</body>
</html>
