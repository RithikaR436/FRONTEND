<!DOCTYPE html>
<html>
<head>
<title>Employee Details</title>
<link rel="stylesheet" href="style.css">
<style>
    body {
  font-family: Arial;
  margin: 40px;
}

input {
  display: block;
  margin: 5px 0;
}

table {
  margin-top: 15px;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ccc;
  padding: 6px 12px;
}
</style>
</head>
<body>

<input type="text" id="empName" placeholder="Employee Name">
<input type="text" id="dept" placeholder="Department">
<input type="number" id="salary" placeholder="Salary">
<button onclick="addEmployee()">Add Employee</button>

<table id="empTable">
  <tr>
    <th>Name</th>
    <th>Department</th>
    <th>Salary</th>
  </tr>
</table>

<script src="assets2/js/"></script>
</body>
</html>
